<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahsan System</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:20px}
main{max-width:600px;margin:auto}
section{background:#1e293b;padding:20px;margin:15px 0;border-radius:12px}
h1{color:#38bdf8}
</style>
</head>
<body>
<main>
<h1>🤖 Ahsan System</h1>
<section>
<h2>د سیستم حالت</h2>
<p id="status">معلومات لوډ کېږي...</p>
</section>
<section>
<h2>کمانډونه</h2>
<div id="commands"></div>
</section>
</main>
<script>
async function load(){
try{
const s=await fetch('/api/status').then(r=>r.json());
document.getElementById('status').textContent='سیستم فعال دی ✅';
const d=await fetch('/api/commands').then(r=>r.json());
document.getElementById('commands').innerHTML=d.commands.map(c=>
'<p><b>.'+c.name+'</b> — '+c.description+'</p>'
).join('');
}catch(e){
document.getElementById('status').textContent='د سرور اړیکه نشته';
}
}
load();
</script>
</body>
</html>
